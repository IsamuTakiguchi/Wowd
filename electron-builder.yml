appId: dev.wowd.app
productName: Wowd
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
# 新規文書のテンプレートは **asar の外** に置く。
# files に入れると asar の中 (resources/app.asar/resources/templates) に入るが、
# 本体は process.resourcesPath/templates を見るので見つからず、
# パッケージ版でだけ「新規作成」が失敗する (実際にそうなっていた)。
extraResources:
  - from: resources/templates
    to: templates
# アイコンは resources/icon.png (1024x1024) の 1 枚だけ置く。
# Windows の .ico と macOS の .icns は electron-builder が起こす。
# 作り直しは npm run icon (原本は resources/icon.svg)
icon: resources/icon.png
win:
  target: nsis
  # 署名する場合は CSC_LINK / CSC_KEY_PASSWORD を環境変数で渡す。
  # 証明書は本人確認が要るので、リポジトリには置かない
mac:
  target: dmg
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
linux:
  target: [AppImage, deb]
  category: Office
  synopsis: 日本語の文書エディタ
  # 起動中の窓と .desktop を結び付ける。無いと環境によっては別物として扱われる
  syncDesktopName: true
fileAssociations:
  - ext: docx
    name: Word 文書
    role: Editor
    icon: resources/icon.png
