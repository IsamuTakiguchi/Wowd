appId: dev.wowd.app
productName: Wowd
# 配るファイルを小さくする。
# maximum は LZMA の圧縮率を上げる (ビルドは遅くなるが、配布は 1 回きり)
compression: maximum
# Electron は既定で 50 以上の言語の翻訳を同梱する。
# 日本語と英語だけ残せば十数 MB 減る
electronLanguages:
  - ja
  - en-US
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
# 新規文書のテンプレートは **asar の外** に置く。
# files に入れると asar の中 (resources/app.asar/resources/templates) に入るが、
# 本体は process.resourcesPath/templates を見るので見つからず、
# パッケージ版でだけ「新規作成」が失敗する (実際にそうなっていた)。
extraResources:
  - from: resources/templates
    to: templates
# アイコンは resources/icon.png (1024x1024) の 1 枚だけ置く。
# Windows の .ico と macOS の .icns は electron-builder が起こす。
# 作り直しは npm run icon (原本は resources/icon.svg)
icon: resources/icon.png
win:
  # 空白を含む名前はリンクや結合で事故のもとなので、ハイフンにする。
  # **これは win の全 target に効く。** インストーラと持ち運び版で名前が衝突しないよう、
  # インストーラ側は下の nsis.artifactName で上書きする。
  # (両方が Wowd-Setup-*.${ext} になっていたため、
  #  リリースの glob が持ち運び版を拾えず zip が配られていなかった)
  artifactName: Wowd-${version}-win.${ext}
  # nsis … インストーラ。**Windows か、32bit の wine がある環境でしか作れない**
  #        (NSIS がアンインストーラを作るのに 32bit の実行ファイルを動かすため)
  # zip  … 展開してそのまま動く持ち運び版。インストール不要・管理者権限不要。
  #        こちらは Linux からでも作れる
  target:
    - nsis
    - zip
  # 署名する場合は CSC_LINK / CSC_KEY_PASSWORD を環境変数で渡す。
  # 証明書は本人確認が要るので、リポジトリには置かない
nsis:
  # インストーラだけは「Setup」が付いた名前にする。
  # 持ち運び版 (zip) と取り違えないように
  artifactName: Wowd-Setup-${version}.${ext}
mac:
  target: dmg
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
linux:
  target: [AppImage, deb]
  category: Office
  synopsis: 日本語の文書エディタ
  # 起動中の窓と .desktop を結び付ける。無いと環境によっては別物として扱われる
  syncDesktopName: true
fileAssociations:
  - ext: docx
    name: Word 文書
    role: Editor
    icon: resources/icon.png
