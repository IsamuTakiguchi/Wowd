name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # フィクスチャとテンプレートは生成物なのでコミットしていない
      - run: npm run fixtures

      # ECMA-376 の XSD。スキップ任せにすると検証が静かに腐るので、
      # CI では必ず取得してからテストする
      - name: Cache OOXML schema
        uses: actions/cache@v4
        with:
          path: schema/ooxml
          key: ooxml-schema-ecma376-part4-5th
      - run: npm run schema:fetch

      - run: npm test

      - run: npm run build
      # Electron の E2E には仮想ディスプレイが要る
      - run: xvfb-run -a npx playwright test
